name: Refresh profile assets

# Regenerates the language-mix card from the GitHub API and commits it back, so the
# README always shows current data without depending on a third-party card service.
on:
  schedule:
    - cron: '17 3 * * *'      # daily, 03:17 UTC
  workflow_dispatch:           # and on demand
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild language-mix card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/build-stats.mjs

      - name: Rebuild 3D hero
        run: node scripts/build-hero.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/
          if git diff --cached --quiet; then
            echo "assets unchanged — nothing to commit"
          else
            git commit -m 'chore: refresh profile assets [skip ci]'
            git push
          fi
